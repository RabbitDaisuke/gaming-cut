</head>
<body>
  <header class="topbar"><a class="brand" href="./"><span class="brand-mark">k</span><strong>ゲーミング加工</strong></a><div class="top-actions"><span class="privacy"><span data-icon="lock"></span>写真はこの端末内で処理</span><button id="add-images"><span data-icon="plus"></span>画像を追加</button></div><input type="file" id="file-input" accept="image/*" multiple hidden></header>
  <main class="workspace">
    <aside class="library" aria-label="画像一覧">
      <div class="library-heading"><h1>画像 <span id="image-count">0</span></h1></div>
      <div id="image-list" class="image-list"></div>
      <div class="library-footer"><button id="export-batch" disabled><span data-icon="download"></span><span id="batch-label">まとめて保存</span></button><span id="batch-count">完成した画像をZIPで保存</span></div>
    </aside>
    <section class="editor" aria-label="ゲーミング加工の編集">
      <div class="empty-state" id="empty"><span class="empty-icon" data-icon="image"></span><button class="primary" id="empty-add"><span data-icon="plus"></span>画像を追加</button><span>JPEG / PNG / WebP · 複数選択可</span></div>
      <div id="editing" hidden>
        <div class="file-heading"><div><strong id="filename"></strong><span id="dimensions"></span></div><button id="remove-image" class="icon-button" aria-label="この画像を削除" title="この画像を削除"><span data-icon="trash"></span></button></div>
        <div class="workbench">
          <section class="photo-panel source-panel" aria-labelledby="select-heading">
            <div class="panel-heading"><h2 id="select-heading">ラメを重ねるものを選ぶ</h2><span class="action-label" id="action-label">なぞって選ぶ</span></div>
            <div class="canvas-area" id="canvas-area"><div class="image-frame" id="frame"><canvas id="canvas" tabindex="0" role="img" aria-label="ラメを重ねるものをなぞる、またはクリック。矢印キーで位置を選びEnterで追加。"></canvas><canvas id="stroke-overlay" aria-hidden="true"></canvas><div id="pins"></div></div></div>
            <div class="photo-tools"><button id="tool-add" aria-pressed="true"><span data-icon="plus-circle"></span>対象を追加</button><span class="spacer"></span><button id="undo" class="icon-button" aria-label="元に戻す" title="元に戻す (Ctrl+Z)" disabled><span data-icon="undo"></span></button><button class="text-button" id="reset" disabled>やり直す</button></div>
            <div class="selection-area"><div class="selection-heading"><strong>ラメを重ねるもの <span id="object-count">0</span></strong><button class="text-button" id="refine" disabled aria-expanded="false">選択を直す</button></div><div id="object-list" class="object-list"></div><div id="refine-tools" class="refine-tools" hidden><span id="refine-label"></span><button id="tool-keep" aria-pressed="false">範囲を広げる</button><button id="tool-remove" aria-pressed="false">余分な所を除く</button><button id="refine-done" class="text-button">完了</button></div></div>
          </section>
          <section class="photo-panel result-panel" aria-labelledby="result-heading">
            <div class="panel-heading"><h2 id="result-heading">仕上がり</h2><button id="show-original" class="text-button" aria-pressed="false" disabled>元の写真と見比べる</button></div>
            <div class="result-area checker" id="result-area"><canvas id="result" role="img" aria-label="ゲーミング加工の仕上がり。消しゴムでラメの範囲を調整。" hidden></canvas><span class="erase-cursor-layer" aria-hidden="true"><span id="erase-cursor" hidden></span></span><div class="result-placeholder" id="result-placeholder"><span data-icon="cutout"></span><span id="result-message">まだ選ばれていません</span><progress id="progress" max="100" hidden></progress><button id="retry" hidden>もう一度試す</button><details id="error-details" hidden><summary>詳細</summary><p id="error-detail"></p></details></div></div>
            <div class="erase-tools"><span>消しゴム</span><div class="erase-sizes" role="group" aria-label="消しゴムの太さ"><button id="erase-size-0" aria-label="消しゴムの太さ 1" aria-pressed="false" disabled><i style="--dot:4px"></i></button><button id="erase-size-1" aria-label="消しゴムの太さ 2" aria-pressed="false" disabled><i style="--dot:7px"></i></button><button id="erase-size-2" aria-label="消しゴムの太さ 3" aria-pressed="true" disabled><i style="--dot:11px"></i></button><button id="erase-size-3" aria-label="消しゴムの太さ 4" aria-pressed="false" disabled><i style="--dot:16px"></i></button><button id="erase-size-4" aria-label="消しゴムの太さ 5" aria-pressed="false" disabled><i style="--dot:22px"></i></button></div><button id="erase-undo" class="icon-button" aria-label="仕上がりを元に戻す" title="元に戻す (Ctrl+Z)" disabled><span data-icon="undo"></span></button></div>
            <div class="result-tools"><span id="result-count">元の背景を残す</span><div class="swatches" role="group" aria-label="確認用の背景色"><button class="swatch checker" data-bg="transparent" aria-label="透明の背景で確認" aria-pressed="true"></button><button class="swatch white" data-bg="#ffffff" aria-label="白の背景で確認" aria-pressed="false"></button><button class="swatch dark" data-bg="#292d29" aria-label="黒の背景で確認" aria-pressed="false"></button></div></div>
            <div class="save-area"><div class="format-switch" role="group" aria-label="保存形式"><button id="format-mp4" aria-pressed="true">MP4 · 動くラメ</button><button id="format-webp" aria-pressed="false">WebP · 軽量画像</button><button id="format-png" aria-pressed="false">PNG</button><button id="format-jpeg" aria-pressed="false" disabled>JPEG · 品質95</button><button id="preview-play" class="text-button" aria-pressed="true">一時停止</button></div><label class="check-row"><input type="checkbox" id="keep-background" checked>背景を残す</label><label class="check-row" id="mp4-fill-row" hidden>MP4の背景色 <input type="color" id="mp4-fill" value="#ffffff"></label><label class="check-row"><input type="checkbox" id="crop">余白を切り詰める（背景OFF時）</label><button class="primary" id="export" disabled><span data-icon="download"></span><span id="export-label">MP4を保存</span></button><button id="cancel-save" hidden>保存をキャンセル</button><span id="output-size"></span></div>
          </section>
        </div>
        <details class="finishing" id="finishing"><summary>仕上がりを調整</summary><div class="finishing-content"><div><h3 id="candidate-label">ラメを重ねる範囲</h3><div class="mask-choices" id="mask-choices"></div></div><div class="sliders"><label for="feather">輪郭をなめらかに<output id="feather-value">1</output></label><input id="feather" type="range" min="0" max="5" step="0.5" value="1"><label for="threshold">輪郭の広さ<output id="threshold-value">標準</output></label><input id="threshold" type="range" min="-0.3" max="0.3" step="0.01" value="0"></div></div></details>
        <div class="glitter-settings"><label for="glitter-opacity">ラメの濃さ <output id="glitter-value">30%</output></label><input id="glitter-opacity" type="range" min="0" max="75" step="1" value="30"><label for="mp4-size">MP4の大きさ</label><select id="mp4-size"><option value="1280">長辺 1280 px</option><option value="1920">長辺 1920 px</option><option value="960">長辺 960 px</option><option value="640">長辺 640 px</option></select><label for="still-size">静止画のサイズ</label><select id="still-size" disabled><option value="1" selected>原寸</option><option value="2">1/2（縦・横）</option><option value="4">1/4（縦・横）</option></select><span>WebPは品質85 · JPEGは透過なしの場合のみ品質95 · 動画と同じラメの1フレームを保存 · 背景OFFの透過保存はWebP・PNG</span></div>
        <div class="statusline"><span id="status" role="status" aria-live="polite"></span><details class="technical"><summary>動作情報</summary><span id="runtime">準備中</span></details></div>
      </div>
    </section>
  </main>
  <footer class="source-footer"><a href="./source.zip" download>ソースコード</a> · <a href="./licenses/AGPL-3.0.txt">AGPL-3.0</a> · <a href="https://github.com/imgly/background-removal-js">IMG.LY Background Removal</a></footer>
  <div id="toast" role="status" hidden></div>
</body>
</html>
